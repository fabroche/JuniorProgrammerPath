    <symbol id="ventana" viewBox="0 0 380 260">
      <rect x="4" y="4" width="372" height="252" rx="16" fill="#1A1D2A" stroke="#333850" stroke-width="3"/>
      <rect x="16" y="40" width="348" height="204" rx="8" fill="#0C0E15"/>
