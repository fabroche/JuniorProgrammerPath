  </defs>
  <rect width="1280" height="720" fill="url(#fondo)"/><rect width="1280" height="720" fill="url(#puntos)"/><rect width="1280" height="720" fill="url(#halo)"/>
  <use href="#ventana" x="150" y="150" width="440" height="300"/><rect x="170" y="372" width="400" height="56" fill="#151824"/><path d="M186 400 H554" stroke="#333850" stroke-width="4" stroke-dasharray="22 16"/><use href="#coche" x="196" y="322" width="150" height="75" color="#22A6C0"/><use href="#copia" x="392" y="300" width="140" height="70" color="#7B76EC" opacity="0.75"/><use href="#ventana" x="690" y="150" width="440" height="300"/><rect x="710" y="372" width="400" height="56" fill="#151824"/><path d="M726 400 H1094" stroke="#333850" stroke-width="4" stroke-dasharray="22 16"/><use href="#copia" x="736" y="322" width="150" height="75" color="#22A6C0" opacity="0.75"/><use href="#coche" x="932" y="300" width="140" height="70" color="#7B76EC"/><path d="M606 300 H674" stroke="#3C4160" stroke-width="4" stroke-dasharray="3 13" stroke-linecap="round"/><circle cx="640" cy="300" r="9" fill="#34D399"/>
  <g><rect x="48" y="44" width="92" height="76" rx="16" fill="#1A1D2A" stroke="#22A6C0" stroke-width="3"/><rect x="66" y="60" width="38" height="30" rx="5" fill="none" stroke="#2FB8D2" stroke-width="3"/><rect x="84" y="74" width="38" height="30" rx="5" fill="#1A1D2A" stroke="#2FB8D2" stroke-width="3"/></g>
</svg>
